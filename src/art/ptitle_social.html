<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Barlow;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2)}
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#000}
.art{position:absolute;inset:0;background:url(poster_social.png)}
.badge{position:absolute;right:44px;top:40px;background:#121110;color:#ffc400;font:62px/1 Anton;padding:5px 20px 7px;letter-spacing:1px}
.slogan{position:absolute;right:44px;top:130px;text-align:right;font-family:Anton;line-height:.98;letter-spacing:1px;font-size:70px}
.slogan .a{color:#121110}.slogan .b{color:#b21a1e}
.title{position:absolute;left:42px;top:494px;font-family:Anton;line-height:1;white-space:nowrap;letter-spacing:2px;font-size:112px}
.title .a{color:#f6e7c1}.title .b{color:#ffc400;margin-left:18px}
.feat{position:absolute;right:44px;top:500px;text-align:right;color:#f6e7c1;font:800 30px/1.3 Barlow;letter-spacing:1.2px}
.feat .r{color:#b21a1e}
</style></head><body>
<div class="art"></div>
<div class="badge" id="badge">1.0</div>
<div class="slogan" id="slogan"><div class="a">THEY SHOOT BUGS.</div><div class="b">NOT YOU.</div></div>
<div class="title" id="title"><span class="a">SMARTER</span><span class="b">SEAF</span></div>
<div class="feat" id="feat">FRIENDLY FIRE SAFETY <span class="r">■</span><br>ARMOR INTELLIGENCE <span class="r">■</span><br>PING TARGETING <span class="r">■</span></div>
<script>document.fonts.ready.then(()=>{const r={};document.querySelectorAll("[id]").forEach(e=>{const b=e.getBoundingClientRect();r[e.id]=[b.left|0,b.top|0,b.right|0,b.bottom|0]});window.INFO=r;window.DONE=true;});</script>
</body></html>

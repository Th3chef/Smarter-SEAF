<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Barlow;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2)}
@font-face{font-family:Barlow;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2)}

html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
.art{position:absolute;inset:0;background:url(comp_wide.png)}

<div class="art"></div>

<script>document.fonts.ready.then(()=>{window.INFO={ok:1};window.DONE=true;});</script>
</body></html>

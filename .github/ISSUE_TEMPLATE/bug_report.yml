name: Bug report
description: Something the mod does wrong, or an error in its log
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The log is the most useful part: it shows what the mod did and any errors.
  - type: input
    id: version
    attributes:
      label: Mod version
      description: Shown at the top of the log and in your mod manager.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version or date of the last game update
      placeholder: "e.g. the October 2026 patch"
  - type: checkboxes
    id: options
    attributes:
      label: Options you have turned on
      options:
        - label: Friendly Fire Safety (helldivers and other troopers)
        - label: Friendly Fire Safety (only helldivers)
        - label: Friendly Fire Safety (only other troopers)
        - label: Armor Intelligence
        - label: Ping Targeting
  - type: input
    id: enemy
    attributes:
      label: Enemy or soldier involved
      placeholder: "e.g. a SEAF specialist and a Charger"
  - type: dropdown
    id: session
    attributes:
      label: Were you playing solo, hosting or joining?
      options: [Solo, Hosting, Joining someone else's game]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Roughly when in the mission it happened helps match it to the log.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Drag SmarterSEAF.log into this box. You'll find it in
        %LOCALAPPDATA%\CowboyBingus\Helldivers2\Logs (paste that into the File Explorer address bar and press Enter).
    validations:
      required: true
  - type: checkboxes
    id: others
    attributes:
      label: Other mods
      options:
        - label: I'm not using another mod that changes SEAF soldier targeting
